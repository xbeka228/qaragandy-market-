<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Регистрация в интернет-магазине Qaragandy Market для покупателей курта из Карагандинской области.">
  <title>Регистрация — Qaragandy Market</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <p class="logo">Qaragandy Market</p>
    <nav>
      <ul class="menu">
        <li><a href="login.html">Вход</a></li>
        <li><a href="register.html">Регистрация</a></li>
      </ul>
    </nav>
  </header>

  <main class="main">
    <section>
      <h1>Регистрация</h1>
      <form class="form" id="register-form" action="#" method="post">
        <label for="fio">ФИО</label>
        <input type="text" id="fio" name="fio" required minlength="2" maxlength="60">

        <label for="phone">Телефон</label>
        <input type="tel" id="phone" name="phone" required pattern="\+7[0-9]{10}" placeholder="+77001234567" title="Номер в формате +7 и десять цифр">

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" required minlength="8" maxlength="30">

        <div class="checkbox">
          <input type="checkbox" id="agree" name="agree" required>
          <label for="agree">Согласен на обработку персональных данных</label>
        </div>

        <button class="button" type="submit">Зарегистрироваться</button>
      </form>
      <p class="message" id="message"></p>
      <p>Уже есть аккаунт? <a href="login.html">Войти</a></p>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
