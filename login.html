<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Вход в интернет-магазин Qaragandy Market по e-mail и паролю.">
  <title>Вход — Qaragandy Market</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <p class="logo">Qaragandy Market</p>
    <nav>
      <ul class="menu">
        <li><a href="login.html">Вход</a></li>
        <li><a href="register.html">Регистрация</a></li>
      </ul>
    </nav>
  </header>

  <main class="main">
    <section>
      <h1>Вход</h1>
      <form class="form" id="login-form" action="#" method="post">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" required minlength="8" maxlength="30">

        <button class="button" type="submit">Войти</button>
      </form>
      <p class="message" id="message"></p>
      <p>Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
